<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Book store</title>

</head>

<body>
    <a href="#wishlistsection" class="skip-to-cart">Skip to Cart</a>
    <header></header>
    <main id="main">
        <h1>Welcome to The Story Cove</h1>
        <h2>Create a profile</h2>
        <form method="get" id="userForm">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" placeholder="Type user name here and save...">
            <button id="adduser">Save User</button>
        </form>

        <form method="get" id="userlistform">
            <label for="userslist">ChangeUser</label>
            <select name="userslist" id="userslist">
                <option value="guest">Guest</option>
            </select>
            <label for="userprefs">Your preferences</label>
            <select name="userprefs" id="userprefs">
                <option value="Genres">Any</option>
                <option value="Adventure">Adventure</option>
                <option value="Criminology">Criminology</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Business economics">Business</option>
                <option value="Dystopian">Dystopian</option>
                <option value="Science fiction">Sci-fi</option>
                <option value="Mystery">Mystery</option>
                <option value="Poem">Poetry</option>
                <option value="Novel">Novel</option>
                <option value="Children">Children</option>
                <option value="Thriller">Thriller</option>
                <option value="Autobiography">Autobiography</option>
                <option value="Biography">Biography</option>
                <option value="Sports">Sports</option>
                <option value="Horror">Horror</option>
                <option value="Mythology">Mythology</option>
                <option value="History">History</option>
                <option value="Science">Science</option>
                <option value="Manga">Manga</option>
                <option value="Drama">Drama</option>
                <option value="Fable">Fables</option>
            </select>   
            <button id="adduserprefs" >Add genre to preferences</button>
            <button id="deleteuserprefs" >Reset prefernces</button>
        </form>
        <h2>Search for a Book</h2>
        <form method="get" id="searchbarform">
            <label for="searchbar">Search bar</label>
            <input type="text" name="searchbar" id="searchbar" placeholder="Type book's title here...">
            <button id="submission" value="Search">Search</button>
            <button id="openAdvanced">Use advance search</button>
        </form>
        <form method="get" id="advancedsearchform" style="display: none;">
            <label for="booktitle">Book's title</label>
            <input type="text" name="booktitle" id="booktitle" placeholder="Type book's title here...">

            <label for="langprefs">Languages</label>
            <select name="langprefs" id="langprefs">
                <option value="Any">Any</option>
                <option value="English">English</option>
                <option value="Italian">Italian</option>
                <option value="French">French</option>
                <option value="German">German</option>
                <option value="Spanish">Spanish</option>
                <option value="Polish">Polish</option>
                <option value="Portuguese">Portuguese</option>
                <option value="Japanese">Japanese</option>
                <option value="Greek">Japanese</option>
            </select>
            <label for="genreprefs">Genres</label>
            <select name="genreprefs" id="genreprefs">
                <option value="Any">Any</option>
                <option value="Adventure">Adventure</option>
                <option value="Criminology">Criminology</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Business economics">Business</option>
                <option value="Dystopian">Dystopian</option>
                <option value="Science fiction">Sci-fi</option>
                <option value="Mystery">Mystery</option>
                <option value="Poem">Poetry</option>
                <option value="Novel">Novel</option>
                <option value="Children">Children</option>
                <option value="Thriller">Thriller</option>
                <option value="Autobiography">Autobiography</option>
                <option value="Biography">Biography</option>
                <option value="Sports">Sports</option>
                <option value="Horror">Horror</option>
                <option value="Mythology">Mythology</option>
                <option value="History">History</option>
                <option value="Science">Science</option>
                <option value="Manga">Manga</option>
                <option value="Drama">Drama</option>
                <option value="Fable">Fables</option>

            </select>

            <label for="authorprefs">Author's name</label>
            <input type="text" name="author" id="authorprefs" placeholder="Type author's name here...">

            <label for="minprice">minimum price</label>
            <input type="number" name="minprice" id="minprice">
            <label for="maxprice">maximum price</label>
            <input type="number" name="maxprice" id="maxprice">


            <label for="minyear">minimum  publication year</label>
            <input type="number" name="year" id="minyear">
            <label for="maxyear">maximum  publication year</label>
            <input type="number" name="year" id="maxyear">

            <label for="minrating">lowest rating</label>
            <input type="number" name="rating" id="minrating">
            <label for="maxrating">highest rating</label>
            <input type="number" name="rating" id="maxrating">

            <button name="addprefs" id="addprefs" value="save">Advance search</button>
            <button id="backToRegular">Regular search</button>
            
        </form>
        <section id="booksresults" style="display: none;">
            <h2>Available books!</h2>
            <p id="availablebooks">

            </p>
        </section>
        <section id="displayprefs" style="display: none;">
            <h2>Books that you may like based on your preferences</h2>
        </section>
        <section id="wishlistsection">
            <h2>Wishlist</h2>
            <p id="wishlist"></p>
            <p id="wishbutton"></p>
            <input type="button" id="showwish" value="show wishlist">
        </section>
        <section id="cartsection">
            <h2>Cart</h2>
            <p id="cart"></p>
            <p id="cartbutton"></p>
            <input type="button" id="showcart" value="show cart">
        </section>
        <a href="#main" class="back-to-top">Go back on top</a>
    </main>
    <script src="app.js"></script>
</body>

</html>
